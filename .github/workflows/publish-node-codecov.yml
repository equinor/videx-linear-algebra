name: Publish Node Test and Coverage Reports

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] only trusted runs pass the job-level guard below
    workflows: ['Run Node Tests with Code Coverage']
    types: [completed]

permissions: {}

jobs:
  prepare-reports:
    name: Prepare test and coverage reports
    if: ${{ (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master') || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      coverage-ready: ${{ steps.upload-coverage.outcome == 'success' }}
      junit-ready: ${{ steps.upload-junit.outcome == 'success' }}
      is-same-repo: ${{ steps.source-artifacts.outputs.is-same-repo }}
      base-sha: ${{ steps.source-artifacts.outputs.base-sha }}
      pr-number: ${{ steps.source-artifacts.outputs.pr-number }}
    steps:
      - name: Locate source report artifacts
        id: source-artifacts
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              },
            );

            const idFor = (name) => {
              const artifact = artifacts.find(
                (candidate) => candidate.name === name && !candidate.expired,
              );
              return artifact ? String(artifact.id) : '';
            };

            core.setOutput('coverage-id', idFor('coverage'));
            core.setOutput('junit-id', idFor('test-results'));

            const pr = context.payload.workflow_run.pull_requests?.[0];
            core.setOutput('is-same-repo', String(context.payload.workflow_run.head_repository?.full_name === context.payload.workflow_run.repository?.full_name));
            core.setOutput('base-sha', pr?.base?.sha ?? '');
            core.setOutput('pr-number', pr?.number ? String(pr.number) : '');

      - name: Download coverage artifact
        id: download-coverage
        if: ${{ steps.source-artifacts.outputs.coverage-id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          artifact-ids: ${{ steps.source-artifacts.outputs.coverage-id }}
          path: input/coverage

      - name: Validate coverage report
        id: validate-coverage
        if: ${{ steps.download-coverage.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          report=input/coverage/Cobertura.xml
          test -s "$report"
          test "$(wc -c < "$report")" -le 5242880
          if grep -Eiq '<!(DOCTYPE|ENTITY)' "$report"; then
            echo 'Coverage XML must not contain DTD declarations' >&2
            exit 1
          fi

      - name: Generate coverage summary
        id: generate-coverage
        if: ${{ steps.validate-coverage.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Path('input/coverage/Cobertura.xml')
          root = ET.parse(source).getroot()
          if root.tag != 'coverage':
            raise ValueError('Cobertura root must be coverage')

          values = {}
          for name in ('lines-covered', 'lines-valid', 'branches-covered', 'branches-valid'):
            value = int(root.attrib[name])
            if value < 0:
              raise ValueError(f'invalid {name}')
            values[name] = value
          if values['lines-covered'] > values['lines-valid'] or values['branches-covered'] > values['branches-valid']:
            raise ValueError('covered count exceeds valid count')

          def row(label, covered, valid):
            rate = covered / valid * 100 if valid else 0
            status = 'Pass' if rate >= 30 else 'Warning' if rate >= 10 else 'Fail'
            return f'| {label} | {covered} / {valid} | {rate:.2f}% | {status} |'

          markdown = '\n'.join((
            '## Code coverage',
            '',
            '| Metric | Covered | Rate | Status |',
            '| --- | ---: | ---: | --- |',
            row('Lines', values['lines-covered'], values['lines-valid']),
            row('Branches', values['branches-covered'], values['branches-valid']),
            '',
          ))
          encoded = markdown.encode('utf-8')
          if len(encoded) > 32768:
            raise ValueError('coverage summary exceeds size limit')
          Path('coverage-report.md').write_bytes(encoded)
          PYTHON

      - name: Find master baseline
        id: baseline
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.source-artifacts.outputs.base-sha }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/test-node-codecov.yml/runs?branch=master&event=push&status=success&per_page=100")
          run_id=$(jq -r --arg sha "$BASE_SHA" '
            if (.workflow_runs | type) == "array" then
              ([.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id][0] // "")
            else
              error("Unexpected workflow runs response")
            end
          ' <<< "$response")
          if [ -n "$run_id" ]; then
            echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate master baseline artifact
        id: baseline-artifact
        if: ${{ steps.baseline.outputs.run-id != '' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run-id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const runId = Number(process.env.BASELINE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setOutput('id', '');
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              },
            );
            const artifact = artifacts.find(
              (candidate) =>
                candidate.name === 'coverage-master-baseline' && !candidate.expired,
            );
            core.setOutput('id', artifact ? String(artifact.id) : '');

      - name: Download master baseline
        id: download-baseline
        if: ${{ steps.baseline-artifact.outputs.id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.baseline.outputs.run-id }}
          artifact-ids: ${{ steps.baseline-artifact.outputs.id }}
          path: input/baseline

      - name: Create coverage comparison
        id: comparison
        if: ${{ steps.generate-coverage.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('coverage-report.md')
          baseline = Path('input/baseline/Cobertura.xml')
          if not baseline.is_file():
              report.write_text(report.read_text(encoding='utf-8') + '\n> Coverage delta unavailable: no successful retained master baseline exists for this PR base.\n', encoding='utf-8')
              raise SystemExit

          def rates(path):
              data = path.read_bytes()
              if not data or len(data) > 5242880:
                  raise ValueError('invalid coverage report size')
              lowered = data.lower()
              if b'<!doctype' in lowered or b'<!entity' in lowered:
                  raise ValueError('DTD declarations are not allowed')
              root = ET.parse(path).getroot()
              if root.tag != 'coverage':
                  raise ValueError('Cobertura root must be coverage')
              values = {}
              for name in ('lines-covered', 'lines-valid', 'branches-covered', 'branches-valid'):
                  value = int(root.attrib[name])
                  if value < 0 or (name.endswith('covered') and value > int(root.attrib[name.replace('covered', 'valid')])):
                      raise ValueError(f'invalid {name}')
                  values[name] = value
              return values

          current = rates(Path('input/coverage/Cobertura.xml'))
          master = rates(baseline)
          rows = []
          for label, covered, valid in (('Lines', 'lines-covered', 'lines-valid'), ('Branches', 'branches-covered', 'branches-valid')):
              if current[valid] and master[valid]:
                  current_rate = current[covered] / current[valid] * 100
                  master_rate = master[covered] / master[valid] * 100
                  rows.append(f'| {label} | {current_rate:.2f}% | {master_rate:.2f}% | {current_rate - master_rate:+.2f} pp |')
          result = report.read_text(encoding='utf-8') + '\n## Overall coverage vs. master baseline\n\n| Metric | PR | Master baseline | Delta |\n| --- | ---: | ---: | ---: |\n' + '\n'.join(rows) + '\n'
          if len(result.encode('utf-8')) > 32768:
              raise ValueError('coverage summary exceeds size limit')
          report.write_text(result, encoding='utf-8')
          PYTHON

      - name: Upload coverage summary
        id: upload-coverage
        if: ${{ steps.generate-coverage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage-report.md
          retention-days: 5
          if-no-files-found: error

      - name: Download test results
        id: download-junit
        if: ${{ steps.source-artifacts.outputs.junit-id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          artifact-ids: ${{ steps.source-artifacts.outputs.junit-id }}
          path: input/test-results

      - name: Normalize test results
        id: validate-junit
        if: ${{ steps.download-junit.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          report=input/test-results/junit.xml
          test -s "$report"
          test "$(wc -c < "$report")" -le 5242880
          if grep -Eiq '<!(DOCTYPE|ENTITY)' "$report"; then
            echo 'JUnit XML must not contain DTD declarations' >&2
            exit 1
          fi
          python3 - <<'PYTHON'
          from math import isfinite
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          source = Path('input/test-results/junit.xml')
          root = ET.parse(source).getroot()
          if root.tag not in ('testsuite', 'testsuites'):
            raise ValueError('JUnit root must be testsuite or testsuites')

          link = re.compile(r'(?i)\b(?:https?://|www\.)\S+')

          def safe(value, limit):
            value = link.sub('[link removed]', value or '')
            value = value.translate(str.maketrans({
              '@': '[at]', '<': '[less-than]', '>': '[greater-than]',
              '!': ' ', '[': '(', ']': ')',
            }))
            return ' '.join(value.split())[:limit]

          def duration(value):
            try:
              parsed = float(value or 0)
            except ValueError:
              return '0'
            return f'{parsed:.6f}' if isfinite(parsed) and 0 <= parsed <= 1000000000 else '0'

          suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
          if not suites or len(suites) > 1000:
            raise ValueError('invalid JUnit suite count')

          output_root = ET.Element('testsuites', {'name': 'Normalized test results'})
          total_tests = total_failures = total_errors = total_skipped = 0
          total_time = 0.0
          for source_suite in suites:
            cases = list(source_suite.findall('testcase'))
            if total_tests + len(cases) > 20000:
              raise ValueError('JUnit test count exceeds limit')
            output_suite = ET.SubElement(output_root, 'testsuite', {
              'name': safe(source_suite.get('name'), 200) or 'Unnamed test suite',
            })
            failures = errors = skipped = 0
            suite_time = 0.0
            for source_case in cases:
              case_time = float(duration(source_case.get('time')))
              suite_time += case_time
              output_case = ET.SubElement(output_suite, 'testcase', {
                'classname': safe(source_case.get('classname'), 200),
                'name': safe(source_case.get('name'), 300) or 'Unnamed test',
                'time': f'{case_time:.6f}',
              })
              result = next((source_case.find(tag) for tag in ('failure', 'error', 'skipped') if source_case.find(tag) is not None), None)
              if result is not None:
                if result.tag == 'failure':
                  failures += 1
                elif result.tag == 'error':
                  errors += 1
                else:
                  skipped += 1
                output_result = ET.SubElement(output_case, result.tag)
                if result.tag != 'skipped':
                  output_result.set('type', safe(result.get('type'), 100))
                  output_result.set('message', safe(result.get('message'), 500))
                  output_result.text = safe(''.join(result.itertext()), 4000)

            tests = len(cases)
            output_suite.attrib.update({
              'tests': str(tests), 'failures': str(failures),
              'errors': str(errors), 'skipped': str(skipped),
              'time': f'{suite_time:.6f}',
            })
            total_tests += tests
            total_failures += failures
            total_errors += errors
            total_skipped += skipped
            total_time += suite_time

          output_root.attrib.update({
            'tests': str(total_tests), 'failures': str(total_failures),
            'errors': str(total_errors), 'skipped': str(total_skipped),
            'time': f'{total_time:.6f}',
          })
          target = Path('prepared/test-results/junit.xml')
          target.parent.mkdir(parents=True, exist_ok=True)
          ET.indent(output_root)
          ET.ElementTree(output_root).write(target, encoding='utf-8', xml_declaration=True)
          if target.stat().st_size > 1048576:
            raise ValueError('normalized JUnit exceeds size limit')
          PYTHON

      - name: Upload test results
        id: upload-junit
        if: ${{ steps.validate-junit.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-test-results
          path: prepared/test-results/junit.xml
          retention-days: 5
          if-no-files-found: error

  publish-reports:
    name: Publish test and coverage reports
    needs: prepare-reports
    if: ${{ always() && (needs.prepare-reports.outputs.coverage-ready == 'true' || needs.prepare-reports.outputs.junit-ready == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Download coverage summary
        id: coverage
        if: ${{ needs.prepare-reports.outputs.coverage-ready == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: coverage-summary
          path: coverage-summary

      - name: Add coverage summary
        if: ${{ steps.coverage.outcome == 'success' }}
        run: cat coverage-summary/coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add coverage PR comment
        if: ${{ steps.coverage.outcome == 'success' && needs.prepare-reports.outputs.pr-number != '' && needs.prepare-reports.outputs.is-same-repo == 'true' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ needs.prepare-reports.outputs.pr-number }}
          path: coverage-summary/coverage-report.md

      - name: Download test results
        id: junit
        if: ${{ needs.prepare-reports.outputs.junit-ready == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: validated-test-results
          path: test-results

      - name: Publish test results
        if: ${{ steps.junit.outcome == 'success' && (github.event.workflow_run.event != 'pull_request' || needs.prepare-reports.outputs.is-same-repo == 'true') }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: test-results/junit.xml
          commit: ${{ github.event.workflow_run.head_sha }}
