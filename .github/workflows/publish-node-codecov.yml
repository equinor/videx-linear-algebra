name: Publish Node Test and Coverage Reports

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] guarded to trusted source runs below
    workflows: ['Run Node Tests with Code Coverage']
    types: [completed]

permissions: {}

jobs:
  prepare-reports:
    name: Prepare test and coverage reports
    if: >-
      ${{
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master') ||
        (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      coverage-ready: ${{ steps.upload-coverage.outcome == 'success' }}
      junit-ready: ${{ steps.upload-junit.outcome == 'success' }}
      is-same-repo: ${{ steps.source-artifacts.outputs.is-same-repo }}
      pr-number: ${{ steps.source-artifacts.outputs.pr-number }}

    steps:
      - name: Locate source report artifacts
        id: source-artifacts
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              },
            );

            const idFor = (name) => {
              const matches = artifacts.filter(
                (artifact) => artifact.name === name && !artifact.expired,
              );
              if (matches.length !== 1) {
                core.warning(`Expected one ${name} artifact, found ${matches.length}.`);
                return '';
              }
              if (matches[0].size_in_bytes > 6291456) {
                core.warning(`${name} artifact exceeds the 6 MiB download limit.`);
                return '';
              }
              return String(matches[0].id);
            };

            core.setOutput('coverage-id', idFor('coverage'));
            core.setOutput('junit-id', idFor('test-results'));

            const run = context.payload.workflow_run;
            const pullRequest = run.pull_requests?.[0];
            core.setOutput(
              'is-same-repo',
              String(run.head_repository?.full_name === run.repository?.full_name),
            );
            core.setOutput('base-sha', pullRequest?.base?.sha ?? '');
            core.setOutput('pr-number', pullRequest?.number ? String(pullRequest.number) : '');

      - name: Download coverage artifact
        id: download-coverage
        if: ${{ steps.source-artifacts.outputs.coverage-id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          artifact-ids: ${{ steps.source-artifacts.outputs.coverage-id }}
          path: input/coverage

      - name: Find master baseline
        id: baseline
        if: ${{ github.event.workflow_run.event == 'pull_request' && steps.source-artifacts.outputs.base-sha != '' }}
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BASE_SHA: ${{ steps.source-artifacts.outputs.base-sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'test-node-codecov.yml',
                branch: 'master',
                event: 'push',
                status: 'success',
                per_page: 100,
              },
            );
            const run = runs.find((candidate) => candidate.head_sha === process.env.BASE_SHA);
            core.setOutput('run-id', run ? String(run.id) : '');

      - name: Locate master baseline artifact
        id: baseline-artifact
        if: ${{ steps.baseline.outputs.run-id != '' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run-id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const runId = Number(process.env.BASELINE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setOutput('id', '');
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              },
            );
            const matches = artifacts.filter(
              (artifact) =>
                artifact.name === 'coverage-master-baseline' && !artifact.expired,
            );
            const artifact = matches.length === 1 ? matches[0] : undefined;
            core.setOutput(
              'id',
              artifact && artifact.size_in_bytes <= 6291456 ? String(artifact.id) : '',
            );

      - name: Download master baseline
        id: download-baseline
        if: ${{ steps.baseline-artifact.outputs.id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.baseline.outputs.run-id }}
          artifact-ids: ${{ steps.baseline-artifact.outputs.id }}
          path: input/baseline

      - name: Normalize coverage reports
        id: normalize-coverage
        if: ${{ steps.download-coverage.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path, PurePosixPath
          import math
          import re
          import xml.etree.ElementTree as ET

          MAX_INPUT = 5 * 1024 * 1024
          MAX_ELEMENTS = 50_000
          MAX_PACKAGES = 500
          MAX_CLASSES = 5_000
          COBERTURA_DOCTYPE = b'<!DOCTYPE coverage SYSTEM "http://cobertura.sourceforge.net/xml/coverage-04.dtd">'
          SAFE_TEXT = re.compile(r'[^A-Za-z0-9 _./:@()+,=#%\-]')

          def clean(value, limit):
              value = ' '.join((value or '').split())
              return SAFE_TEXT.sub('?', value)[:limit] or 'unnamed'

          def checked_path(value):
              value = (value or '').replace('\\', '/')
              path = PurePosixPath(value)
              if path.is_absolute() or '..' in path.parts or re.match(r'^[A-Za-z]:', value):
                  raise ValueError('unsafe coverage path')
              return clean(value, 300)

          def integer(element, name, maximum=10_000_000):
              value = int(element.attrib[name])
              if value < 0 or value > maximum:
                  raise ValueError(f'invalid {name}')
              return value

          def rate(element, name, fallback):
              value = float(element.attrib.get(name, fallback))
              if not math.isfinite(value) or not 0 <= value <= 1:
                  raise ValueError(f'invalid {name}')
              return value

          def normalize(source, destination):
              raw = source.read_bytes()
              raw = raw.replace(COBERTURA_DOCTYPE, b'', 1)
              upper = raw.upper()
              if not raw or len(raw) > MAX_INPUT or b'<!DOCTYPE' in upper or b'<!ENTITY' in upper:
                  raise ValueError('unsafe coverage document')
              root = ET.fromstring(raw)
              elements = list(root.iter())
              if root.tag != 'coverage' or len(elements) > MAX_ELEMENTS:
                  raise ValueError('unexpected coverage structure')

              lines_valid = integer(root, 'lines-valid')
              lines_covered = integer(root, 'lines-covered')
              branches_valid = integer(root, 'branches-valid')
              branches_covered = integer(root, 'branches-covered')
              if lines_covered > lines_valid or branches_covered > branches_valid:
                  raise ValueError('coverage totals are inconsistent')

              line_rate = lines_covered / lines_valid if lines_valid else 0
              branch_rate = branches_covered / branches_valid if branches_valid else 0
              output = ET.Element('coverage', {
                  'lines-valid': str(lines_valid),
                  'lines-covered': str(lines_covered),
                  'line-rate': f'{line_rate:.6f}',
                  'branches-valid': str(branches_valid),
                  'branches-covered': str(branches_covered),
                  'branch-rate': f'{branch_rate:.6f}',
                  'timestamp': '0',
                  'complexity': '0',
                  'version': 'normalized',
              })
              sources = ET.SubElement(output, 'sources')
              ET.SubElement(sources, 'source').text = '.'
              packages = ET.SubElement(output, 'packages')

              source_packages = root.findall('./packages/package')
              if len(source_packages) > MAX_PACKAGES:
                  raise ValueError('too many coverage packages')
              class_count = 0
              for source_package in source_packages:
                  package = ET.SubElement(packages, 'package', {
                      'name': clean(source_package.attrib.get('name'), 200),
                      'line-rate': f"{rate(source_package, 'line-rate', line_rate):.6f}",
                      'branch-rate': f"{rate(source_package, 'branch-rate', branch_rate):.6f}",
                      'complexity': '0',
                  })
                  classes = ET.SubElement(package, 'classes')
                  for source_class in source_package.findall('./classes/class'):
                      class_count += 1
                      if class_count > MAX_CLASSES:
                          raise ValueError('too many coverage classes')
                      klass = ET.SubElement(classes, 'class', {
                          'name': clean(source_class.attrib.get('name'), 200),
                          'filename': checked_path(source_class.attrib.get('filename')),
                          'line-rate': f"{rate(source_class, 'line-rate', line_rate):.6f}",
                          'branch-rate': f"{rate(source_class, 'branch-rate', branch_rate):.6f}",
                          'complexity': '0',
                      })
                      ET.SubElement(klass, 'methods')
                      ET.SubElement(klass, 'lines')

              ET.indent(output, space='  ')
              destination.parent.mkdir(parents=True, exist_ok=True)
              ET.ElementTree(output).write(destination, encoding='utf-8', xml_declaration=True)
              if destination.stat().st_size > 2 * 1024 * 1024:
                  raise ValueError('normalized coverage report is too large')

          normalize(Path('input/coverage/Cobertura.xml'), Path('normalized/coverage/Cobertura.xml'))
          baseline = Path('input/baseline/Cobertura.xml')
          if baseline.is_file():
              try:
                  normalize(baseline, Path('normalized/baseline/Cobertura.xml'))
              except (ET.ParseError, KeyError, TypeError, ValueError):
                  print('::warning::The retained master coverage baseline was invalid and was ignored.')
          PYTHON

      - name: Generate coverage summary
        id: generate-coverage
        if: ${{ steps.normalize-coverage.outcome == 'success' }}
        continue-on-error: true
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: normalized/coverage/Cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: file
          thresholds: '10 30'

      - name: Create coverage comparison
        id: comparison
        if: ${{ steps.generate-coverage.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('coverage-report.md')
          summary = Path('code-coverage-results.md').read_text(encoding='utf-8')
          if len(summary) > 65_536 or any(ord(char) < 32 and char not in '\n\t' for char in summary):
              raise ValueError('unsafe coverage summary')
          report.write_text(summary, encoding='utf-8')

          baseline = Path('normalized/baseline/Cobertura.xml')
          if not baseline.is_file():
              with report.open('a', encoding='utf-8') as output:
                  output.write('\n> Coverage delta unavailable: no successful retained master baseline exists for this PR base.\n')
              raise SystemExit

          def rates(path):
              root = ET.parse(path).getroot()
              return {
                  name: int(root.attrib[name])
                  for name in ('lines-covered', 'lines-valid', 'branches-covered', 'branches-valid')
              }

          current = rates(Path('normalized/coverage/Cobertura.xml'))
          master = rates(baseline)
          rows = []
          for label, covered, valid in (
              ('Lines', 'lines-covered', 'lines-valid'),
              ('Branches', 'branches-covered', 'branches-valid'),
          ):
              if current[valid] and master[valid]:
                  current_rate = current[covered] / current[valid] * 100
                  master_rate = master[covered] / master[valid] * 100
                  rows.append(
                      f'| {label} | {current_rate:.2f}% | {master_rate:.2f}% | '
                      f'{current_rate - master_rate:+.2f} pp |'
                  )
          with report.open('a', encoding='utf-8') as output:
              output.write('\n## Overall coverage vs. master baseline\n\n')
              output.write('| Metric | PR | Master baseline | Delta |\n')
              output.write('| --- | ---: | ---: | ---: |\n')
              output.write('\n'.join(rows) + '\n')
          if report.stat().st_size > 65_536:
              raise ValueError('coverage report is too large')
          PYTHON

      - name: Upload coverage summary
        id: upload-coverage
        if: ${{ steps.comparison.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage-report.md
          retention-days: 5
          if-no-files-found: error

      - name: Download test results
        id: download-junit
        if: ${{ steps.source-artifacts.outputs.junit-id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          artifact-ids: ${{ steps.source-artifacts.outputs.junit-id }}
          path: input/test-results

      - name: Normalize test results
        id: normalize-junit
        if: ${{ steps.download-junit.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import math
          import re
          import xml.etree.ElementTree as ET

          MAX_INPUT = 5 * 1024 * 1024
          MAX_ELEMENTS = 50_000
          MAX_TEST_CASES = 10_000
          SAFE_TEXT = re.compile(r'[^A-Za-z0-9 _./:@()+,=#%\-]')

          def clean(value, limit):
              value = ' '.join((value or '').split())
              return SAFE_TEXT.sub('?', value)[:limit] or 'unnamed'

          def duration(value):
              result = float(value or 0)
              if not math.isfinite(result) or result < 0 or result > 86_400:
                  raise ValueError('invalid test duration')
              return result

          source = Path('input/test-results/junit.xml')
          raw = source.read_bytes()
          upper = raw.upper()
          if not raw or len(raw) > MAX_INPUT or b'<!DOCTYPE' in upper or b'<!ENTITY' in upper:
              raise ValueError('unsafe JUnit document')
          root = ET.fromstring(raw)
          elements = list(root.iter())
          if root.tag != 'testsuites' or len(elements) > MAX_ELEMENTS:
              raise ValueError('unexpected JUnit structure')

          output = ET.Element('testsuites', {'name': 'vitest tests'})
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          total_time = 0.0
          case_count = 0
          for source_suite in root.findall('./testsuite'):
              suite = ET.SubElement(output, 'testsuite', {
                  'name': clean(source_suite.attrib.get('name'), 200),
              })
              suite_totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
              suite_time = 0.0
              for source_case in source_suite.findall('./testcase'):
                  case_count += 1
                  if case_count > MAX_TEST_CASES:
                      raise ValueError('too many test cases')
                  case_time = duration(source_case.attrib.get('time'))
                  testcase = ET.SubElement(suite, 'testcase', {
                      'classname': clean(source_case.attrib.get('classname'), 300),
                      'name': clean(source_case.attrib.get('name'), 300),
                      'time': f'{case_time:.6f}',
                  })
                  suite_totals['tests'] += 1
                  suite_time += case_time
                  for result_name in ('failure', 'error', 'skipped'):
                      result = source_case.find(result_name)
                      if result is None:
                          continue
                      suite_totals[{'failure': 'failures', 'error': 'errors', 'skipped': 'skipped'}[result_name]] += 1
                      normalized = ET.SubElement(testcase, result_name, {
                          'message': clean(result.attrib.get('message'), 500),
                          'type': clean(result.attrib.get('type'), 100),
                      })
                      normalized.text = clean(result.text, 4_000)

              for name, value in suite_totals.items():
                  suite.set(name, str(value))
                  totals[name] += value
              suite.set('time', f'{suite_time:.6f}')
              total_time += suite_time

          for name, value in totals.items():
              output.set(name, str(value))
          output.set('time', f'{total_time:.6f}')
          ET.indent(output, space='  ')
          destination = Path('normalized/test-results/junit.xml')
          destination.parent.mkdir(parents=True, exist_ok=True)
          ET.ElementTree(output).write(destination, encoding='utf-8', xml_declaration=True)
          if destination.stat().st_size > 2 * 1024 * 1024:
              raise ValueError('normalized JUnit report is too large')
          PYTHON

      - name: Upload normalized test results
        id: upload-junit
        if: ${{ steps.normalize-junit.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: normalized-test-results
          path: normalized/test-results/junit.xml
          retention-days: 5
          if-no-files-found: error

  publish-reports:
    name: Publish test and coverage reports
    needs: prepare-reports
    if: >-
      ${{
        always() &&
        (needs.prepare-reports.outputs.coverage-ready == 'true' || needs.prepare-reports.outputs.junit-ready == 'true')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: write

    steps:
      - name: Download coverage summary
        id: coverage
        if: ${{ needs.prepare-reports.outputs.coverage-ready == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: coverage-summary
          path: coverage-summary

      - name: Add coverage summary
        if: ${{ steps.coverage.outcome == 'success' }}
        run: cat coverage-summary/coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add coverage PR comment
        if: ${{ steps.coverage.outcome == 'success' && needs.prepare-reports.outputs.pr-number != '' && needs.prepare-reports.outputs.is-same-repo == 'true' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ needs.prepare-reports.outputs.pr-number }}
          path: coverage-summary/coverage-report.md

      - name: Download test results
        id: junit
        if: ${{ needs.prepare-reports.outputs.junit-ready == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: normalized-test-results
          path: test-results

      - name: Publish test results
        if: ${{ steps.junit.outcome == 'success' && (github.event.workflow_run.event != 'pull_request' || needs.prepare-reports.outputs.is-same-repo == 'true') }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: test-results/junit.xml
          commit: ${{ github.event.workflow_run.head_sha }}
